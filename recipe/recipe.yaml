# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.8.0"
  python_check_max: "3.14"

package:
  name: jsonschema-markdown
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/j/jsonschema-markdown/jsonschema_markdown-${{ version }}.tar.gz
    sha256: b286414d739f918fdff4213945a1e1b0d7ffab4f94f4d1d410545b8c9224d06a
    target_directory: dist
  - url: https://github.com/elisiariocouto/jsonschema-markdown/archive/refs/tags/${{ version }}.tar.gz
    sha256: 52bed0f5335100f594a083a4a3f04994d9701c36f66d9d900a5d50621af24821
    target_directory: src
    patches:
      # TODO: remove after https://github.com/elisiariocouto/jsonschema-markdown/pull/44
      - 0000-open-utf8-tests.patch

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - jsonschema-markdown = jsonschema_markdown.main:cli

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - click >=8.1.7,<9
    - jsonref >=1.1.0,<2
    - loguru >=0.7.2
    - python >=${{ python_min }}
    - pyyaml >=6.0.2,<7

tests:
  - python:
      imports: jsonschema_markdown
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - src/tests/
    requirements:
      run:
        - pydantic
        - pytest-cov
        - python ${{ python_min }}.*
    script:
      content:
        - jsonschema-markdown --help
        - jsonschema-markdown --version | ${{ 'grep -iE' if unix else 'findstr /c' }} "${{ version | replace('.', '\\.') }}"
        - cd src
        - coverage run --source=jsonschema_markdown --branch -m pytest -vv --tb=long --color=yes
        - coverage report --show-missing --skip-covered --fail-under=84

about:
  summary: Export a JSON Schema document to Markdown documentation.
  license: MIT
  license_file: dist/LICENSE
  homepage: https://pypi.org/project/jsonschema-markdown
  repository: https://github.com/elisiariocouto/jsonschema-markdown

extra:
  recipe-maintainers:
    - bollwyvl
