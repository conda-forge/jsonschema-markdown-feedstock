# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2026.11.0"
  python_check_max: "3.15"

package:
  name: jsonschema-markdown
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/j/jsonschema-markdown/jsonschema_markdown-${{ version }}.tar.gz
    sha256: b21b1d0452533d7cbf80b1959c77d9fe6781d161f5c235f49acef08bceb003b3
    target_directory: dist
  - url: https://github.com/elisiariocouto/jsonschema-markdown/archive/refs/tags/${{ version }}.tar.gz
    sha256: f910b8b85989b3801a3666e9b582ff391e3eeb28152e3bacc532b2b361cd857c
    target_directory: src

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
  python:
    entry_points:
      - jsonschema-markdown = jsonschema_markdown.main:cli

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - click >=8.1.7,<9
    - jsonref >=1.1.0,<2
    - loguru >=0.7.2
    - python >=${{ python_min }}
    - pyyaml >=6.0.2,<7

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/jsonschema-markdown/**
      site_packages:
        - jsonschema_markdown/**
        - jsonschema_markdown-${{ version }}.dist-info/**
  - python:
      imports: jsonschema_markdown
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - src/tests/
    requirements:
      run:
        - pydantic
        - pytest-cov
        - python ${{ python_min }}.*
    script:
      content:
        - jsonschema-markdown --help
        - jsonschema-markdown --version | ${{ 'grep -iE' if unix else 'findstr /c' }} "${{ version | replace('.', '\\.') }}"
        - cd src
        - coverage run --source=jsonschema_markdown --branch -m pytest -vv --tb=long --color=yes
        - coverage report --show-missing --skip-covered --fail-under=84

about:
  summary: Export a JSON Schema document to Markdown documentation.
  license: MIT
  license_file: dist/LICENSE
  homepage: https://pypi.org/project/jsonschema-markdown
  repository: https://github.com/elisiariocouto/jsonschema-markdown

extra:
  recipe-maintainers:
    - bollwyvl
